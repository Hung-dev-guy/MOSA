services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mosa}
      POSTGRES_USER: ${POSTGRES_USER:-mosa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MOSA_PORT:-8080}:8080"
    environment:
      SECRET_KEY: ${MOSA_SECRET_KEY:?Set MOSA_SECRET_KEY in .env}
      DATABASE_URL: postgresql://postgres:5432
      PGDATABASE: ${POSTGRES_DB:-mosa}
      PGUSER: ${POSTGRES_USER:-mosa}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEMO_MODE: "1"
      COOKIE_SECURE: "0"
    volumes:
      - ./instance/docker:/app/instance
      - ./instance/text-search-model:/app/instance/text-search-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/session', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
