services:
  web:
    build: .
    ports:
      - "127.0.0.1:${MOSA_PORT:-8080}:8080"
    environment:
      SECRET_KEY: ${MOSA_SECRET_KEY:?Set MOSA_SECRET_KEY in .env}
      DATABASE: /app/instance/mosa.sqlite
      DEMO_MODE: "1"
      COOKIE_SECURE: "0"
    volumes:
      - ./instance/docker:/app/instance
      - ./instance/text-search-model:/app/instance/text-search-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/session', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
