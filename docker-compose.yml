name: mosa-stationery

x-database-environment: &database-environment
  DB_SERVER: db,1433
  DB_NAME: ${DB_NAME:-ECommerceMultimodalV1}
  DB_DRIVER: ODBC Driver 18 for SQL Server
  DB_USER: sa
  DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Run start-docker.ps1 or set MSSQL_SA_PASSWORD}
  DB_ENCRYPT: "yes"
  DB_CONNECT_TIMEOUT: "15"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run start-docker.ps1 or set MSSQL_SA_PASSWORD}
    ports:
      - "${SQL_PORT:-14330}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
            SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          else
            SQLCMD=/opt/mssql-tools/bin/sqlcmd;
          fi;
          "$$SQLCMD" -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C
          -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  db-init:
    build:
      context: .
    command: ["python", "tools/init_database.py"]
    environment:
      <<: *database-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
    environment:
      <<: *database-environment
      HOST: 0.0.0.0
      PORT: "5050"
      APP_CURRENCY: VND
    ports:
      - "${APP_PORT:-5050}:5050"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5050/api/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mssql-data:
